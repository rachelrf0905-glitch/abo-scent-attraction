*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#382052,#110b1c 55%,#080610);color:#f8edf9;font-family:Georgia,'Songti SC',serif}.shell{max-width:490px;min-height:100vh;margin:auto;background:linear-gradient(#1b102b,#100a1b 50%,#160d23);padding-bottom:25px}header{padding:22px 24px;border-bottom:1px solid #ffffff18;display:flex;justify-content:space-between;color:#d6bde3;font:11px sans-serif;letter-spacing:2px}.seal{border:1px solid #c997bd;padding:5px 8px}.page{padding:24px}.art{height:280px;border:1px solid #8a5794;border-radius:48% 48% 8px 8px;background:linear-gradient(0deg,#140b22a8,transparent 44%),url('ABO视觉主图.png') center center/cover;box-shadow:inset 0 0 35px #bd77d855;position:relative;display:grid;place-items:center;font-size:0;overflow:hidden}.art:after{content:'';display:none}.k{text-align:center;color:#d49ac9;font-size:12px;letter-spacing:4px;margin:23px 0 10px}h1{text-align:center;font-size:35px;line-height:1.4;letter-spacing:4px;margin:8px}h1 em{font-size:25px;color:#edc7e5;font-style:normal}.intro{text-align:center;color:#c4b4c9;line-height:2;font-size:14px}.gate,article{border:1px solid #62466b;background:#ffffff08;padding:18px;margin:22px 0;text-align:center}.gate label{letter-spacing:3px;color:#e9c9e3}.gate input{margin:15px 0 10px;width:100%;padding:13px;background:#100a1b;border:1px solid #62466b;color:white;text-align:center;font-size:18px;letter-spacing:8px}.btn{width:100%;border:0;padding:15px;background:linear-gradient(100deg,#a75e9d,#684d92);color:white;font:15px Georgia,serif;letter-spacing:2px;cursor:pointer}.btn.alt{background:transparent;border:1px solid #a36d9c}.fine{text-align:center;color:#95849c;font:11px/1.8 sans-serif}.progress{height:3px;background:#49324f;margin:20px 0}.progress i, .bar i{display:block;height:100%;background:linear-gradient(90deg,#b763a4,#e6bde1)}h2{font-size:23px;line-height:1.6}.opts{display:grid;gap:11px}.opt{width:100%;padding:15px;text-align:left;color:#eee2f2;background:#ffffff08;border:1px solid #523d5b;font:15px/1.6 Georgia,serif;cursor:pointer}.opt b{color:#d899ca;margin-right:10px}nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;color:#a58baa;font-size:12px}nav button{padding:9px 12px;color:#dfc5e4;background:transparent;border:1px solid #755581;cursor:pointer}.report{text-align:center}.sigil{margin:16px auto;width:90px;height:90px;border-radius:50%;border:1px solid #e0a8d4;display:grid;place-items:center;font-size:52px;color:#f0c9e7;box-shadow:0 0 30px #b56daf66}.type{font-size:20px;color:#f0d2eb}.scent{color:#d19fc9;letter-spacing:2px;font-size:13px}article{text-align:left;margin:15px 0;padding:19px}article h3{font-size:16px;color:#eac4e2}article p{font-size:14px;color:#c6b8cc;line-height:2}.trait{display:grid;grid-template-columns:68px 1fr 30px;gap:8px;align-items:center;margin:14px 0;font:12px sans-serif}.bar{height:5px;background:#39283f}.trait b{color:#e7b8da;font-weight:400}.match{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #ffffff18;font-size:14px}.match b{color:#d99ccc}.actions{display:grid;gap:11px;margin:22px 0}.error{color:#ff9dba;font-size:13px}
</style><div class="shell"><header><span>✦ MOON ECLIPSE ACADEMY</span><span class="seal">气味档案</span></header><div id="app"></div></div><script>
const qs=[['月蚀学院的迎新舞会停电了，你最先做什么？',['循着微弱香气找到出口','安抚受惊的新生并组织集合','判断电路位置，带人去查看','先确认重要的人是否安全']],['初次遇见一位气味特别的同学，你会？',['保持距离，观察对方反应','主动打招呼，坦率表达好奇','记住细节，找机会再次交谈','把相遇当作命运给的暗号']],['学院安排你与陌生人组队，你更看重？',['能力互补，目标明确','相处舒服，能彼此信任','灵感碰撞，不拘一格','忠诚可靠，关键时刻站在一起']],['一封匿名信说有人正被误解，你会？',['悄悄查证事实再出手','公开询问，给对方解释机会','找到当事人直接谈清楚','不管代价，先保护弱者']],['你的信息素突然失控，最希望同伴？',['给我空间，保持冷静','温柔陪伴，别急着追问','帮我分析诱因和应对办法','用坚定的拥抱告诉我没关系']],['学院竞赛决赛前队友犯错，你会？',['迅速调整策略补救','鼓励队友，一起扛下结果','指出问题并带队复盘','替队友承担责难']],['有人向你提出一段关系的承诺，你会？',['先观察行动是否一致','认真沟通彼此的期待','心动就回应，不让遗憾发生','相信羁绊，也守住自己的边界']],['发现校规掩盖了一段旧日真相，你会？',['收集证据，等待合适时机','说服大家一起追问','直接揭开谜底','权衡影响，寻找最稳妥的改变']],['毕业夜可以带走一样东西，你选？',['写满计划的星图','朋友们留下的合照','一瓶记录青春气味的香水','一枚象征自由的银色徽章']],['多年后重回学院，你希望留下什么？',['一套能延续的制度','被珍惜的深厚关系','敢于做自己的勇气','帮助后来者找到归属的灯火']]];
const t=[['雾松·冷杉引路者','Alpha','雪松、雨后冷杉与白胡椒','冷静果决 · 守护本能','夜色越深，你越能辨清方向。你不需要高声证明力量；可靠的行动就是你的答案。'],['赤焰·琥珀执炬者','Alpha','琥珀、烟熏玫瑰与辛香','炽烈坚定 · 天生领袖','你像一簇不会轻易熄灭的火，点亮同伴，也照见自己。记得把温柔留给内心。'],['星潮·海盐航行者','Alpha','海盐、杜松与矿石气息','自由无畏 · 破局者','你追逐辽阔，也尊重每个人的航线。真正的自由不是孤身远行，而是自愿并肩。'],['月桂·白茶守望者','Beta','白茶、月桂叶与晨露','清醒温和 · 平衡者','你能在纷乱中保留清醒，也让不同的人找到共同语言。你的温柔自有边界。'],['鸢尾·晚香倾听者','Beta','鸢尾、紫罗兰与鸢尾根','细腻敏锐 · 共情者','你总能听见话语背后的心声。请相信，自己的感受也值得被认真倾听。'],['琉璃·柑橘织梦者','Beta','佛手柑、橙花与晶亮麝香','灵动创造 · 点子王','你把寻常日子变成新故事。好奇心带你前行，行动让梦想发光。'],['蔷薇·蜜桃信使','Omega','蜜桃、粉玫瑰与柔软香草','热情真挚 · 情感纽带','你让关系有了温度。被爱不需要以牺牲自我为代价，真诚也包括善待自己。'],['暮云·桂花收藏家','Omega','桂花、乌龙与暖木','安静坚韧 · 内在力量','你拥有不喧哗的韧性，能在低潮之后重新舒展。慢一点，也是在向前。'],['蝶梦·铃兰追光者','Omega','铃兰、梨花与清甜麝香','浪漫敏锐 · 灵魂旅人','你愿意相信奇迹，也有把微光带给他人的能力。']];
const base=[[82,49,55,74,81],[88,75,58,78,65],[78,53,92,64,76],[50,77,55,83,80],[42,96,61,86,72],[48,67,91,62,70],[45,96,63,92,62],[53,79,57,88,91],[47,82,94,76,67]],traits=['主导力','共情力','探索欲','忠诚度','边界感'];let page='home',n=0,ans=Array(10).fill(-1),res;
function render(){let a=document.getElementById('app');if(page==='home'){a.innerHTML=`<div class="page"><div class="art">✧</div><p class="k">在月色与信息素之间</p><h1>ABO<br><em>气味引力测试</em></h1><p class="intro">月蚀学院的午夜钟声响起。<br>十次选择，解锁你的气味人格与命定引力。</p><div class="gate"><label>学院入场验证码</label><input id="code" placeholder="输入六位验证码" maxlength="6" inputmode="numeric"><button class="btn" onclick="start()">开启我的气味档案　✧</button><div id="err"></div></div><p class="fine">约 3 分钟 · 纯娱乐体验</p></div>`;return}if(page==='quiz'){a.innerHTML=`<div class="page"><p class="k">学院试炼　${String(n+1).padStart(2,'0')} / 10</p><div class="progress"><i style="width:${(n+1)*10}%"></i></div><h2>${qs[n][0]}</h2><div class="opts">${qs[n][1].map((x,i)=>`<button class="opt" onclick="choose(${i})"><b>0${i+1}</b>${x}</button>`).join('')}</div><nav><button onclick="back()" ${n===0?'disabled':''}>上一题</button><span>第 ${n+1} 章</span><button onclick="next()" ${ans[n]<0?'disabled':''}>下一题</button></nav></div>`;return}let ix=res.main,main=t[ix];a.innerHTML=`<div class="page report" id="capture"><p class="k">MOON ECLIPSE · PERSONALITY FILE</p><h1>你的气味档案</h1><div class="sigil">${main[1]==='Alpha'?'α':main[1]==='Beta'?'β':'Ω'}</div><div class="type">${main[1]} · ${main[0]}</div><p class="scent">「${main[2]}」</p><article><h3>✦ 人格画像 · ${main[3]}</h3><p>${main[4]}</p>${traits.map((x,i)=>`<div class="trait"><span>${x}</span><div class="bar"><i style="width:${res.scores[i]}%"></i></div><b>${res.scores[i]}</b></div>`).join('')}</article><article><h3>✦ 引力关系 TOP 3</h3>${res.match.map((x,i)=>`<div class="match"><b>0${i+1}</b><span>${x}</span><small>${['灵魂共振','温柔互补','命运交汇'][i]}</small></div>`).join('')}</article><article><h3>✦ 专属故事 · 午夜温室</h3><p>最后一场舞会散场后，你在玻璃花房遇见了那位熟悉的身影。玫瑰与月桂的气息交织，蝴蝶停在香水瓶沿。他把一朵花递给你：“这次，让我们按自己的方式写结局。”远处钟声敲响，你忽然明白，所谓引力，是自由地选择靠近。</p></article><div class="actions"><button class="btn" onclick="again()">再来一次</button><button class="btn alt" onclick="save()">保存完整结果 PNG</button></div><p class="fine">结果由答题选项确定性生成，仅供娱乐参考。</p></div>`}
function start(){if(document.getElementById('code').value==='758821'){page='quiz';n=0;render()}else document.getElementById('err').innerHTML='<p class="error">验证码不正确，请再试一次。</p>'}function choose(i){ans[n]=i;if(n<9){n++;render()}else finish()}function next(){if(ans[n]>=0){if(n===9)finish();else{n++;render()}}}function back(){if(n>0){n--;render()}}function finish(){let scores=Array(9).fill(0);ans.forEach((x,i)=>{scores[(x*2+i+i%3)%9]++;scores[((x*2+i+i%3)%9+3)%9]+=.25});let order=scores.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]).map(x=>x[1]),main=order[0];res={main,match:order.slice(1,4).map(i=>t[i][0]),scores:base[main].map((v,i)=>Math.max(35,Math.min(98,v+ans.reduce((s,q,j)=>s+((q+j+i)%3-1)*2,0))))};page='result';render()}function again(){page='home';n=0;ans=Array(10).fill(-1);render()}function save(){let css=[...document.querySelectorAll('style')].map(x=>x.innerHTML).join(''),content=document.getElementById('capture').cloneNode(true);content.querySelector('.actions').remove();content.querySelector('.fine').remove();let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="980"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" style="background:#100a1b;color:#f8edf9;padding:35px;font-family:Georgia,'Songti SC',serif"><style>${css}</style>${content.outerHTML}</div></foreignObject></svg>`,blob=new Blob([svg],{type:'image/svg+xml'}),url=URL.createObjectURL(blob),img=new Image();img.onload=()=>{let c=document.createElement('canvas');c.width=980;c.height=img.height*980/img.width;let x=c.getContext('2d');x.fillStyle='#100a1b';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);let l=document.createElement('a');l.download='月蚀学院-ABO气味档案.png';l.href=c.toDataURL('image/png');l.click();URL.revokeObjectURL(url)};img.onerror=()=>alert('当前浏览器限制本地图片导出，请换用 Chrome 或 Edge。');img.src=url}render();
</script></html>
